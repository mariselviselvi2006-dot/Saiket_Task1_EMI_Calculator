<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- LEFT SIDE -->
    <section class="calculator">

        <h1>EMI Calculator</h1>
        <p class="subtitle">Calculate your monthly loan payment</p>

        <!-- Loan Amount -->
        <div class="input-group">

            <div class="label-row">
                <label>Loan Amount</label>
                <strong>₹ <span id="loanAmountValue">5,00,000</span></strong>
            </div>

            <input type="range"
                   id="loanAmount"
                   min="50000"
                   max="5000000"
                   step="10000"
                   value="500000">

            <div class="range-labels">
                <span>₹50K</span>
                <span>₹50L</span>
            </div>

        </div>


        <!-- Tenure -->
        <div class="input-group">

            <div class="label-row">
                <label>Tenure</label>
                <strong><span id="tenureValue">5</span> Years</strong>
            </div>

            <input type="range"
                   id="tenure"
                   min="1"
                   max="30"
                   value="5">

            <div class="range-labels">
                <span>1 Year</span>
                <span>30 Years</span>
            </div>

        </div>


        <!-- Interest Rate -->
        <div class="input-group">

            <div class="label-row">
                <label>Interest Rate</label>
                <strong><span id="interestValue">10</span>%</strong>
            </div>

            <input type="range"
                   id="interest"
                   min="1"
                   max="30"
                   step="0.1"
                   value="10">

            <div class="range-labels">
                <span>1%</span>
                <span>30%</span>
            </div>

        </div>


        <button onclick="calculateEMI()">
            Calculate EMI
        </button>

    </section>


    <!-- RIGHT SIDE -->
    <section class="result-card">

        <p class="result-title">Your Monthly EMI</p>

        <h2 id="result">₹0.00</h2>

        <div class="details">

            <div class="detail-box">
                <span>Loan Amount</span>
                <strong id="displayPrincipal">₹0</strong>
            </div>

            <div class="detail-box">
                <span>Total Interest</span>
                <strong id="displayInterest">₹0</strong>
            </div>

            <div class="detail-box">
                <span>Total Payment</span>
                <strong id="displayTotal">₹0</strong>
            </div>

        </div>


        <!-- Breakdown -->
        <div class="breakdown">

            <div class="breakdown-title">
                Payment Breakdown
            </div>

            <div class="bar">
                <div id="principalBar"></div>
            </div>

            <div class="legend">

                <span>
                    <i class="principal-dot"></i>
                    Principal
                </span>

                <span>
                    <i class="interest-dot"></i>
                    Interest
                </span>

            </div>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
